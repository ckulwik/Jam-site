name: Deploy main (CD)

on:
  # Triggers the workflow when a pull request is merged to main
  pull_request:
    types: [closed]
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: 
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install
        run: npm install
      
      - name: Build
        run: npm run build
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::894258438834:role/JammSiteS3Update

      - name: Upload to S3
        run: aws s3 sync ./dist/ s3://bugandbeejamm.co --delete

      - name: Refresh HTML cache on S3
        run: aws s3 cp s3://bugandbeejamm.co/index.html s3://bugandbeejamm.co/index.html --metadata-directive REPLACE --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html"

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

