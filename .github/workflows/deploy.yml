# This is a basic workflow to help you get started with Actions

name: Deploy main (CD)

# Controls when the action will run. 
on:
  # Triggers the workflow when a pull request is merged to main
  pull_request:
    types: [closed]
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: 
  id-token: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install
        run: npm install
      
      - name: Build
        run: npm run build
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::490315706174:role/S3-bucket-update
          role-session-name: MySessionName

# TODO rename the s3 bucket to be "bugandbeejamm.co" --> 2 m's
      - name: Upload to S3
        run: aws s3 sync ./build/ s3://bugandbeejam.co --delete --acl public-read

      - name: Refresh HTML cache on S3
        run: aws s3 cp s3://bugandbeejam.co/index.html s3://bugandbeejam.co/index.html --metadata-directive REPLACE --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html"

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

